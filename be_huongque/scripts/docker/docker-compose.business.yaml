

services:
  authservice:
    build:
      context: ../../authservice
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - eurekaserver
      - apigateway
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: authservice
      DB_PASSWORD: auth
      DB_NAME: authdb
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      RESEND_KEY: ${RESEND_KEY}
      PORT: 8081
    volumes:
      - ./authservice:/app

  userservice:
    build:
      context: ../../userservice
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - rabbitmq
      - eurekaserver
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: userservice
      DB_PASSWORD: user
      DB_NAME: userdb
      PORT: 8083
      EUREKA_HOST: eurekaserver
      EUREKA_PORT: 8761
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: adminhuongque
      RABBITMQ_PASSWORD: huongque
      RABBITMQ_QUEUE: file.upload
      RABBITMQ_QUEUE_RESPONSE: file.upload.response
    volumes:
      - ./userservice:/app

